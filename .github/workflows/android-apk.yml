
name: Build Warkop Loyal Celebes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Warkop Loyal Celebes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip Warkop_Loyal_Celebes_Android_Project_v2.zip -d project
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project/warkop_loyal_celebes
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warkop-Loyal-Celebes-APK
          path: project/warkop_loyal_celebes/app/build/outputs/apk/debug/app-debug.apk
