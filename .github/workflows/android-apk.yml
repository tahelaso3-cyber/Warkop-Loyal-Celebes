
name: Build Warkop Loyal Celebes APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Warkop_Loyal_Celebes_Android_Project_v2.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil berkas proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      -       - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Android SDK Platform
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          gradle-version: '8.9'

      - name: Ekstrak proyek
        run: |
          unzip Warkop_Loyal_Celebes_Android_Project_v2.zip -d project
          test -f project/warkop_loyal_celebes/app/build.gradle

      - name: Bangun APK
        working-directory: project/warkop_loyal_celebes
        run: gradle assembleDebug

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: Warkop-Loyal-Celebes-APK
          path: project/warkop_loyal_celebes/app/build/outputs/apk/debug/app-debug.apk
