
name: Build Warkop Loyal Celebes APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip Warkop_Loyal_Celebes_Android_Project_v2.zip -d project

      - name: Build APK
        run: |
          cd project/warkop_loyal_celebes
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Warkop-Loyal-Celebes-APK
          path: project/warkop_loyal_celebes/app/build/outputs/apk/debug/app-debug.apk
